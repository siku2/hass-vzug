# Progress on the Home Assistant Integration Quality Scale
# https://developers.home-assistant.io/docs/core/integration-quality-scale/
# Custom integrations can't claim a tier in the manifest, this file only tracks
# where the integration stands.
rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration registers no actions.
  appropriate-polling: done
  brands: todo
  common-modules: todo
  config-flow-test-coverage: todo
  config-flow: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: The integration registers no actions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: todo
  entity-event-setup:
    status: exempt
    comment: Entities only listen to their coordinators, through CoordinatorEntity.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: todo
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: todo

  # Silver
  action-exceptions: todo
  config-entry-unloading: done
  docs-configuration-parameters: todo
  docs-installation-parameters: todo
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: todo
  reauthentication-flow: todo
  test-coverage: todo

  # Gold
  devices: done
  diagnostics: todo
  discovery-update-info: done
  discovery: done
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices: todo
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices:
    status: exempt
    comment: A config entry is one appliance, there are no devices to add later.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: todo
  entity-translations: done
  exception-translations: todo
  icon-translations: todo
  reconfiguration-flow: todo
  repair-issues: done
  stale-devices:
    status: exempt
    comment: A config entry is one appliance, removing the entry removes the device.

  # Platinum
  async-dependency: done
  inject-websession: todo
  strict-typing: todo
