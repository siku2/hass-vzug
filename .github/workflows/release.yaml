name: "Release"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release"
        required: true
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  prepare:
    name: "Prepare release"
    runs-on: "ubuntu-26.04"
    permissions:
      contents: read
    outputs:
      domain: ${{ steps.info.outputs.domain }}
      component_dir: ${{ steps.info.outputs.component_dir }}
      hacs_filename: ${{ steps.info.outputs.hacs_filename }}
      version: ${{ steps.info.outputs.version }}
      tag_name: ${{ steps.info.outputs.tag_name }}
      release_body: ${{ steps.git-cliff.outputs.content }}
    steps:
      - name: "Checkout the repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: "Gather information"
        id: info
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: .github/workflows/release-info.sh

      - name: "Generate changelog"
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        id: git-cliff
        with:
          config: ""
          args: --verbose --unreleased --strip=header --config-url=https://raw.githubusercontent.com/orhun/git-cliff/refs/heads/main/examples/github.toml
        env:
          GITHUB_REPO: ${{ github.repository }}
          GIT_CLIFF_TAG: ${{ steps.info.outputs.tag_name }}

  release:
    needs: prepare
    name: "Release"
    runs-on: "ubuntu-26.04"
    permissions:
      contents: write
    steps:
      - name: "Checkout the repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Build the integration"
        env:
          COMPONENT_DIR: ${{ needs.prepare.outputs.component_dir }}
          HACS_FILENAME: ${{ needs.prepare.outputs.hacs_filename }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          yq -i -o json '.version = strenv(VERSION)' "$COMPONENT_DIR/manifest.json"
          cd "$COMPONENT_DIR"
          zip "$HACS_FILENAME" -r ./

      - name: "Create release"
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body: ${{ needs.prepare.outputs.release_body }}
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          files: ${{ needs.prepare.outputs.component_dir }}/${{ needs.prepare.outputs.hacs_filename }}
